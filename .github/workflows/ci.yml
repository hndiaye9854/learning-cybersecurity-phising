name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Vérifier que l'application démarre
        env:
          PORT: 3010
          ADMIN_TOKEN: ci-token-not-secret
          DATA_FILE: /tmp/ci-data/submissions.json
        run: |
          node src/server.js &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:3010/healthz && exit 0
            sleep 0.5
          done
          echo "L'application n'a pas démarré" && exit 1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image Docker
        run: docker build -t portail-sensibilisation-phishing:ci .

# Reverse proxy nginx pour cyber.hamidnd.me → application Node (127.0.0.1:8130)
# À copier dans /etc/nginx/sites-available/ puis activer (voir README).
# Les certificats sont générés par certbot (Let's Encrypt).

# Limitation simple du débit des soumissions (anti-spam du formulaire)
limit_req_zone $binary_remote_addr zone=phishdemo_post:10m rate=10r/m;

# HTTP → redirection HTTPS (et challenge ACME pour certbot)
server {
    listen 80;
    listen [::]:80;
    server_name cyber.hamidnd.me;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cyber.hamidnd.me;

    ssl_certificate     /etc/letsencrypt/live/cyber.hamidnd.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cyber.hamidnd.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Pas de journalisation des IP : cohérent avec le cadre éthique de la démo.
    access_log off;

    client_max_body_size 4k;

    location = /acces {
        limit_req zone=phishdemo_post burst=5 nodelay;
        proxy_pass http://127.0.0.1:8130;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8130;
        include /etc/nginx/proxy_params;
    }
}
